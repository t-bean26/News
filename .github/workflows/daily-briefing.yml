name: Daily briefing

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 6:00 AM US Eastern (standard time)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests anthropic

      - name: Build briefing
        run: python build_briefing.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save briefing
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add briefing.json
          git diff --staged --quiet || git commit -m "Update briefing"
          git push
